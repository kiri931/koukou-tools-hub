<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t">
  <title id="t">三脚の上部にある雲台。カメラを載せて向きを決める部分</title>
  <text x="20" y="24" font-family="sans-serif" font-size="14" fill="currentColor" font-weight="bold">三脚の上でカメラの向きを決める部分が「雲台」</text>

  <g transform="translate(180,44)">
    <rect x="30" y="0" width="120" height="34" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <rect x="66" y="-14" width="34" height="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <circle cx="90" cy="17" r="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="160" y="20" font-family="sans-serif" font-size="12" fill="currentColor">カメラ</text>

    <rect x="56" y="40" width="68" height="30" fill="#0ea5e9" fill-opacity="0.3" stroke="currentColor" stroke-width="2"/>
    <path d="M124 55 H180" stroke="currentColor" stroke-width="1.5"/>
    <text x="186" y="52" font-family="sans-serif" font-size="14" fill="currentColor" font-weight="bold">雲台</text>
    <text x="186" y="70" font-family="sans-serif" font-size="12" fill="currentColor">カメラを載せる台。</text>
    <text x="186" y="88" font-family="sans-serif" font-size="12" fill="currentColor">上下・左右・傾きを決める。</text>

    <path d="M90 70 V96" stroke="currentColor" stroke-width="3"/>
    <path d="M90 96 L20 190 M90 96 L90 196 M90 96 L160 190" stroke="currentColor" stroke-width="3" fill="none"/>
    <path d="M12 196 H28 M82 200 H98 M152 196 H168" stroke="currentColor" stroke-width="3"/>
    <text x="0" y="216" font-family="sans-serif" font-size="12" fill="currentColor">脚（3本）</text>

    <g stroke="#f59e0b" stroke-width="2" fill="none">
      <path d="M40 34 A34 22 0 0 0 40 62"/>
      <path d="M40 62 l-2 -8 l8 3 z" fill="#f59e0b" stroke="none"/>
      <path d="M150 34 A34 22 0 0 1 150 62"/>
      <path d="M150 62 l2 -8 l-8 3 z" fill="#f59e0b" stroke="none"/>
    </g>
  </g>

  <text x="20" y="270" font-family="sans-serif" font-size="12" fill="currentColor">3方向を別々に動かす3ウェイ雲台と、1か所で自由に回る自由雲台がある。</text>
  <text x="20" y="290" font-family="sans-serif" font-size="12" fill="currentColor">三脚に据えても指の力でぶれるので、レリーズでシャッターを切る。</text>
</svg>
