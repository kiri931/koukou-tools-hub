<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t">
  <title id="t">順光・側光・斜光・逆光の4つの光の向きと、被写体にできる陰影の違い</title>
  <text x="20" y="24" font-family="sans-serif" font-size="14" fill="currentColor" font-weight="bold">光をどの向きから当てるかで、立体の見え方が変わる</text>

  <g transform="translate(150,44)">
    <circle cx="90" cy="90" r="34" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="90" y="140" text-anchor="middle" font-family="sans-serif" font-size="12" fill="currentColor">被写体</text>
    <g stroke="#f59e0b" stroke-width="2" fill="none">
      <path d="M90 172 V132"/><path d="M90 132 l-5 8 h10 z" fill="#f59e0b" stroke="none"/>
      <path d="M8 90 H48"/><path d="M48 90 l-8 -5 v10 z" fill="#f59e0b" stroke="none"/>
      <path d="M22 22 L54 54"/><path d="M54 54 l-9 -2 l2 9 z" fill="#f59e0b" stroke="none"/>
      <path d="M90 8 V48"/><path d="M90 48 l-5 -8 h10 z" fill="#f59e0b" stroke="none"/>
    </g>
    <text x="90" y="188" text-anchor="middle" font-family="sans-serif" font-size="12" fill="currentColor" font-weight="bold">順光（正面から）</text>
    <text x="0" y="86" text-anchor="middle" font-family="sans-serif" font-size="12" fill="currentColor" font-weight="bold">側光</text>
    <text x="0" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" fill="currentColor">真横</text>
    <text x="18" y="14" font-family="sans-serif" font-size="12" fill="currentColor" font-weight="bold">斜光（45度）</text>
    <text x="150" y="14" font-family="sans-serif" font-size="12" fill="currentColor" font-weight="bold">逆光（後ろ）</text>
  </g>

  <g transform="translate(30,246)">
    <g>
      <circle cx="30" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <text x="30" y="62" text-anchor="middle" font-family="sans-serif" font-size="12" fill="currentColor">順光: 影が出ず平板</text>
    </g>
    <g transform="translate(150,0)">
      <circle cx="30" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M30 4 A20 20 0 0 1 30 44 Z" fill="#64748b" fill-opacity="0.55"/>
      <text x="30" y="62" text-anchor="middle" font-family="sans-serif" font-size="12" fill="currentColor">側光: 影が濃い</text>
    </g>
    <g transform="translate(300,0)">
      <circle cx="30" cy="24" r="20" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path d="M44 10 A20 20 0 0 1 30 44 A20 20 0 0 0 44 10 Z" fill="#64748b" fill-opacity="0.4"/>
      <path d="M30 44 A20 20 0 0 0 44 10 L30 24 Z" fill="#64748b" fill-opacity="0.4"/>
      <text x="30" y="62" text-anchor="middle" font-family="sans-serif" font-size="12" fill="currentColor" font-weight="bold">斜光: 立体的</text>
    </g>
    <g transform="translate(450,0)">
      <circle cx="30" cy="24" r="20" fill="#64748b" fill-opacity="0.55" stroke="currentColor" stroke-width="1.5"/>
      <text x="30" y="62" text-anchor="middle" font-family="sans-serif" font-size="12" fill="currentColor">逆光: 被写体が暗い</text>
    </g>
  </g>
</svg>
