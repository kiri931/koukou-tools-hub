<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t">
  <title id="t">紙の目（縦目と横目）と、本の背に対する目の向きの良し悪し</title>
  <text x="20" y="24" font-family="sans-serif" font-size="14" fill="currentColor" font-weight="bold">紙の目＝すいたときにできる繊維の向き</text>

  <g transform="translate(30,40)">
    <rect x="0" y="0" width="120" height="160" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <g stroke="#0ea5e9" stroke-width="1.5">
      <path d="M14 8 V152 M32 8 V152 M50 8 V152 M68 8 V152 M86 8 V152 M104 8 V152"/>
    </g>
    <text x="0" y="180" font-family="sans-serif" font-size="13" fill="currentColor" font-weight="bold">縦目（T目）</text>
    <text x="0" y="198" font-family="sans-serif" font-size="12" fill="currentColor">長い辺に平行</text>
  </g>
  <g transform="translate(190,40)">
    <rect x="0" y="0" width="120" height="160" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <g stroke="#f59e0b" stroke-width="1.5">
      <path d="M8 16 H112 M8 36 H112 M8 56 H112 M8 76 H112 M8 96 H112 M8 116 H112 M8 136 H112"/>
    </g>
    <text x="0" y="180" font-family="sans-serif" font-size="13" fill="currentColor" font-weight="bold">横目（Y目）</text>
    <text x="0" y="198" font-family="sans-serif" font-size="12" fill="currentColor">短い辺に平行</text>
  </g>

  <g transform="translate(370,40)">
    <text x="0" y="0" font-family="sans-serif" font-size="13" fill="currentColor" font-weight="bold">本の背と目の向き</text>

    <g transform="translate(0,16)">
      <text x="0" y="12" font-family="sans-serif" font-size="18" fill="currentColor">○</text>
      <path d="M26 4 V64" stroke="currentColor" stroke-width="4"/>
      <rect x="26" y="4" width="90" height="60" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <g stroke="#10b981" stroke-width="1.5"><path d="M38 10 V58 M52 10 V58 M66 10 V58 M80 10 V58 M94 10 V58 M108 10 V58"/></g>
      <text x="126" y="26" font-family="sans-serif" font-size="12" fill="currentColor">背と目が平行</text>
      <text x="126" y="44" font-family="sans-serif" font-size="12" fill="currentColor">よく開く</text>
    </g>

    <g transform="translate(0,108)">
      <text x="0" y="12" font-family="sans-serif" font-size="18" fill="currentColor">×</text>
      <path d="M26 4 V64" stroke="currentColor" stroke-width="4"/>
      <rect x="26" y="4" width="90" height="60" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <g stroke="#f43f5e" stroke-width="1.5"><path d="M32 14 H112 M32 26 H112 M32 38 H112 M32 50 H112"/></g>
      <text x="126" y="26" font-family="sans-serif" font-size="12" fill="currentColor">背と目が直角</text>
      <text x="126" y="44" font-family="sans-serif" font-size="12" fill="currentColor">開きが悪く、波打つ</text>
    </g>
  </g>

  <text x="20" y="252" font-family="sans-serif" font-size="12" fill="currentColor">目に沿って折るのが順目。逆らって折る逆目は、折り目が割れたり毛羽立ったりする。</text>
  <text x="20" y="274" font-family="sans-serif" font-size="12" fill="currentColor">太い縦線が背。○×の記号で良し悪しを示している（色だけの区別ではない）。</text>
</svg>
