<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="t">
  <title id="t">面付けした大きな紙を折ると、ページ順にそろった折丁になる</title>
  <text x="20" y="24" font-family="sans-serif" font-size="14" fill="currentColor" font-weight="bold">面付け → 折る → 折丁（ページ順のかたまり）</text>

  <g transform="translate(20,48)">
    <text x="0" y="0" font-family="sans-serif" font-size="13" fill="currentColor" font-weight="bold">面付け（大きな紙の上での並び）</text>
    <rect x="0" y="10" width="240" height="140" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <path d="M60 10 V150 M120 10 V150 M180 10 V150 M0 80 H240" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3"/>
    <g font-family="sans-serif" font-size="18" fill="currentColor" font-weight="bold" text-anchor="middle">
      <text x="30" y="52">5</text><text x="90" y="52">4</text><text x="150" y="52">1</text><text x="210" y="52">8</text>
      <g transform="rotate(180 30 116)"><text x="30" y="122">6</text></g>
      <g transform="rotate(180 90 116)"><text x="90" y="122">3</text></g>
      <g transform="rotate(180 150 116)"><text x="150" y="122">2</text></g>
      <g transform="rotate(180 210 116)"><text x="210" y="122">7</text></g>
    </g>
    <text x="0" y="172" font-family="sans-serif" font-size="12" fill="currentColor">下の段は上下が逆さま。折ると正しい向きになる。</text>
    <text x="0" y="190" font-family="sans-serif" font-size="12" fill="currentColor">点線＝折り位置</text>
  </g>

  <g stroke="currentColor" stroke-width="2" fill="none">
    <path d="M288 128 H348"/>
    <path d="M348 128 l-10 -6 v12 z" fill="currentColor" stroke="none"/>
  </g>
  <text x="286" y="112" font-family="sans-serif" font-size="12" fill="currentColor">2回折る</text>

  <g transform="translate(380,48)">
    <text x="0" y="0" font-family="sans-serif" font-size="13" fill="currentColor" font-weight="bold">折丁（8ページ）</text>
    <path d="M20 20 V150" stroke="currentColor" stroke-width="4"/>
    <g fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M20 20 H150 V150 H20"/>
      <path d="M20 26 H146 M20 32 H142"/>
    </g>
    <g font-family="sans-serif" font-size="13" fill="currentColor">
      <text x="60" y="60">1 → 2 → 3 …</text>
      <text x="60" y="82">→ 8</text>
    </g>
    <text x="0" y="172" font-family="sans-serif" font-size="12" fill="currentColor">太い線が背。ここを綴じる。</text>
    <text x="0" y="190" font-family="sans-serif" font-size="12" fill="currentColor">16・32ページの折丁もある。</text>
  </g>

  <text x="20" y="272" font-family="sans-serif" font-size="12" fill="currentColor">折り方が決まらないと面付けは決まらない。順番の管理には背標や背丁を使う。</text>
  <text x="20" y="292" font-family="sans-serif" font-size="12" fill="currentColor">どのページに何を入れるかを折丁の単位で決めた表が台割。</text>
</svg>
